name: Translation
description: Offer a new language, or fix a translated text.
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! We only ship languages a native speaker has read through, so a new language needs someone to
        review it and, ideally, to keep it up to date as new scenes are added. How to add one:
        [docs/authoring.md](https://github.com/tkjaer/how-the-internet-works/blob/main/docs/authoring.md#add-a-language).
  - type: dropdown
    id: kind
    attributes:
      label: What is it
      options: [A new language, A fix to an existing translation]
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Deutsch (de)
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Where (for a fix)
      description: Copy the address from your browser.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: For a fix, the current text and what it should say. For a new language, how you'd like to help.
    validations:
      required: true
  - type: checkboxes
    id: native
    attributes:
      label: Review
      options:
        - label: I'm a native (or fluent) speaker of this language.
        - label: I'm happy to be asked to review new texts in this language later.
