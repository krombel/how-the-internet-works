name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build
        run: |
          npx vite preview --port 5318 --strictPort &
          for i in $(seq 30); do curl -sf http://127.0.0.1:5318/ >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Accessibility, day
        run: npm run evaluate -- --only=a11y
        env:
          SWIFTSHADER: '1'
      - name: Accessibility, night
        run: npm run evaluate -- --only=a11y --mode=night
        env:
          SWIFTSHADER: '1'
