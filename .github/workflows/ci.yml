name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  a11y:
    name: a11y (${{ matrix.mode }})
    runs-on: ubuntu-latest
    # day and night side by side, each about 15 min on a software renderer (about 30 min one after the other, #21)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [day, night]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build
        run: |
          npx vite preview --host 127.0.0.1 --port 5318 --strictPort &
          for i in $(seq 30); do curl -sf http://127.0.0.1:5318/ >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Accessibility, ${{ matrix.mode }}
        run: npm run evaluate -- --only=a11y --mode="$MODE"
        env:
          MODE: ${{ matrix.mode }}
          SWIFTSHADER: '1'
          EVALUATE_NO_LOCK: '1'
